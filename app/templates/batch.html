<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Processing - imgdithr</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-body">
    <form id="batch-form" class="app-layout">
        <!-- Sidebar Left (Tools & Nav) -->
        <aside class="sidebar sidebar-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="14 2 18 6 7 17 3 17 3 13 14 2"></polygon><line x1="3" y1="22" x2="21" y2="22"></line></svg>
            </div>
            
            <div class="nav-links">
                <a href="{{ url_for('main.index') }}" class="nav-btn" title="Single Image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </a>
                <a href="{{ url_for('main.batch') }}" class="nav-btn active" title="Batch Processing">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                </a>
            </div>

            <!-- Toolbar (only shown in edit mode) -->
            <div id="toolbar-icons" class="toolbar-icons" style="display: none;">
                <input type="radio" id="res" name="mode" value="resolution" checked onchange="toggleInputs()">
                <label for="res" class="tool-btn" title="Resize">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
                </label>

                <input type="radio" id="rotate" name="mode" value="rotate" onchange="toggleInputs()">
                <label for="rotate" class="tool-btn" title="Rotate">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                </label>

                <input type="radio" id="filter" name="mode" value="filter" onchange="toggleInputs()">
                <label for="filter" class="tool-btn" title="Filters">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"></path></svg>
                </label>

                <input type="radio" id="adjust" name="mode" value="adjust" onchange="toggleInputs()">
                <label for="adjust" class="tool-btn" title="Adjustments">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </label>

                <input type="radio" id="rembg" name="mode" value="remove_bg" onchange="toggleInputs()">
                <label for="rembg" class="tool-btn" title="Remove BG">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </label>

                <input type="radio" id="watermark" name="mode" value="watermark" onchange="toggleInputs()">
                <label for="watermark" class="tool-btn" title="Watermark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
                </label>
            </div>

            <div class="bottom-actions">
                <label class="theme-switch" for="theme-checkbox" title="Toggle Dark Mode">
                    <input type="checkbox" id="theme-checkbox" onchange="toggleTheme(this.checked)" />
                    <span class="slider round">
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                </label>
            </div>
        </aside>

        <!-- Main Canvas Area -->
        <main class="canvas-wrapper">
            <div id="loader-overlay">
                <div class="spinner"></div>
                <p id="loader-text">Processing Batch...</p>
            </div>

            <div id="step-1-upload" class="upload-container">
                <div class="upload-area">
                    <label for="images" class="upload-label">
                        <div class="icon-container">
                            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                        </div>
                        <span class="upload-text">Select Multiple Images</span>
                        <span class="upload-subtext">Click or Drag & Drop</span>
                        <input type="file" name="images" id="images" accept="image/*" multiple required onchange="updateFileCount(this)">
                    </label>
                </div>
            </div>

            <div id="step-2-edit" class="preview-container" style="display: none; align-items: center; justify-content: center;">
                <div class="batch-status-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="success-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <h2 id="file-count">0 images ready</h2>
                    <p>Select your batch operations on the left sidebar.</p>
                    <button type="button" class="icon-btn danger" onclick="startOver()" style="margin-top: 1rem;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        Start Over
                    </button>
                </div>
            </div>

            <div id="step-3-download" class="preview-container" style="display: none; align-items: center; justify-content: center;">
                <div class="batch-status-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="success-icon"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <h2>Processing Complete!</h2>
                    <p>All images have been successfully processed and packed into a ZIP file.</p>
                    <a id="batch-download-btn" href="#" class="primary-btn" style="margin-top: 1.5rem; text-decoration: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download ZIP Archive
                    </a>
                </div>
            </div>
        </main>

        <!-- Sidebar Right (Settings) -->
        <aside class="sidebar sidebar-right" id="settings-sidebar" style="display: none;">
            <div class="settings-header">
                <h3>Batch Settings</h3>
            </div>
            
            <div class="settings-content">
                <div id="inputs-frame">
                    <div id="resolution-inputs">
                        <label class="setting-label">Dimensions</label>
                        <div class="input-row">
                            <input type="number" name="width" placeholder="W" min="1" value="500">
                            <span class="x-divider">×</span>
                            <input type="number" name="height" placeholder="H" min="1" value="500">
                        </div>
                    </div>
                    
                    <div id="rotate-inputs" style="display:none;">
                        <label class="setting-label">Rotation (Degrees)</label>
                        <div class="input-row">
                            <input type="number" name="rotate_deg" placeholder="e.g. 90" value="90">
                        </div>
                    </div>

                    <div id="filter-inputs" style="display:none;">
                        <label class="setting-label">Filter Type</label>
                        <div class="input-row">
                            <select name="filter_type">
                                <option value="grayscale">Grayscale</option>
                                <option value="sepia">Sepia</option>
                                <option value="blue">Blue Tone</option>
                                <option value="warm">Warm Tone</option>
                            </select>
                        </div>
                    </div>

                    <div id="adjust-inputs" style="display:none;" class="slider-group">
                        <div class="slider-item">
                            <div class="slider-header">
                                <label>Brightness</label>
                                <span id="val-bright" class="val-badge">1.0</span>
                            </div>
                            <input type="range" name="brightness" min="0.0" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-bright').innerText=this.value">
                        </div>
                        <div class="slider-item">
                            <div class="slider-header">
                                <label>Contrast</label>
                                <span id="val-cont" class="val-badge">1.0</span>
                            </div>
                            <input type="range" name="contrast" min="0.0" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-cont').innerText=this.value">
                        </div>
                        <div class="slider-item">
                            <div class="slider-header">
                                <label>Saturation</label>
                                <span id="val-sat" class="val-badge">1.0</span>
                            </div>
                            <input type="range" name="saturation" min="0.0" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-sat').innerText=this.value">
                        </div>
                        <div class="slider-item">
                            <div class="slider-header">
                                <label>Sharpness</label>
                                <span id="val-sharp" class="val-badge">1.0</span>
                            </div>
                            <input type="range" name="sharpness" min="0.0" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val-sharp').innerText=this.value">
                        </div>
                    </div>

                    <div id="watermark-inputs" style="display:none;">
                        <div class="wm-group">
                            <label class="setting-label">Text Watermark</label>
                            <input type="text" name="wm_text" placeholder="Enter text...">
                        </div>
                        <div class="wm-row">
                            <div class="wm-group">
                                <label class="setting-label">Color</label>
                                <div class="color-picker-wrapper">
                                    <input type="color" name="wm_color" value="#ffffff" class="color-picker">
                                </div>
                            </div>
                            <div class="wm-group" style="flex:2;">
                                <div class="slider-header">
                                    <label>Opacity</label>
                                    <span id="val-wm-opacity" class="val-badge">128</span>
                                </div>
                                <input type="range" name="wm_opacity" min="0" max="255" value="128" oninput="document.getElementById('val-wm-opacity').innerText=this.value">
                            </div>
                        </div>
                        <div class="wm-group">
                            <label class="setting-label">Or Image Logo</label>
                            <input type="file" name="wm_image" accept="image/*" class="file-input-small">
                        </div>
                    </div>
                </div>

                <div class="export-section">
                    <label class="setting-label">Output Format</label>
                    <select name="save_format" id="save_format">
                        <option value="AUTO">Auto (Keep original)</option>
                        <option value="JPEG">JPEG</option>
                        <option value="PNG">PNG</option>
                        <option value="WEBP">WEBP</option>
                    </select>
                </div>
            </div>

            <div class="settings-footer">
                <button type="button" class="primary-btn" onclick="startBatch()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Start Batch
                </button>
            </div>
        </aside>
    </form>

    <script>
        const isDark = localStorage.getItem('darkMode') === 'true';
        document.getElementById('theme-checkbox').checked = isDark;
        if (isDark) document.body.classList.add('dark-mode');

        function toggleTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'true');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'false');
            }
        }

        function updateFileCount(input) {
            if (input.files.length > 0) {
                document.getElementById('file-count').innerText = `${input.files.length} images ready`;
                document.getElementById('step-1-upload').style.display = 'none';
                document.getElementById('step-2-edit').style.display = 'flex';
                document.getElementById('settings-sidebar').style.display = 'flex';
                document.getElementById('toolbar-icons').style.display = 'flex';
                
                const navLinks = document.querySelector('.nav-links');
                if (navLinks) navLinks.style.display = 'none';
            }
        }

        function toggleInputs() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('resolution-inputs').style.display = (mode === 'resolution') ? 'block' : 'none';
            document.getElementById('filter-inputs').style.display = (mode === 'filter') ? 'block' : 'none';
            document.getElementById('rotate-inputs').style.display = (mode === 'rotate') ? 'block' : 'none';
            document.getElementById('adjust-inputs').style.display = (mode === 'adjust') ? 'block' : 'none';
            document.getElementById('watermark-inputs').style.display = (mode === 'watermark') ? 'block' : 'none';
        }

        function startOver() {
            document.getElementById('batch-form').reset();
            document.getElementById('file-count').innerText = '0 images ready';
            document.getElementById('step-2-edit').style.display = 'none';
            document.getElementById('step-3-download').style.display = 'none';
            document.getElementById('step-1-upload').style.display = 'flex';
            document.getElementById('settings-sidebar').style.display = 'none';
            document.getElementById('toolbar-icons').style.display = 'none';
            
            const navLinks = document.querySelector('.nav-links');
            if (navLinks) navLinks.style.display = 'flex';
            
            toggleInputs();
        }

        let pollInterval = null;

        function startBatch() {
            const form = document.getElementById('batch-form');
            const formData = new FormData(form);
            const loaderOverlay = document.getElementById('loader-overlay');
            const loaderText = document.getElementById('loader-text');
            
            loaderOverlay.style.display = 'flex';
            loaderText.innerText = 'Starting batch job...';

            fetch('/batch/start', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    loaderOverlay.style.display = 'none';
                    return;
                }
                
                const jobId = data.job_id;
                pollInterval = setInterval(() => {
                    fetch(`/batch/status/${jobId}`)
                    .then(res => res.json())
                    .then(status => {
                        if (status.status === 'completed') {
                            clearInterval(pollInterval);
                            loaderOverlay.style.display = 'none';
                            document.getElementById('step-1-upload').style.display = 'none';
                            document.getElementById('step-2-edit').style.display = 'none';
                            document.getElementById('settings-sidebar').style.display = 'none';
                            document.getElementById('toolbar-icons').style.display = 'none';
                            document.getElementById('step-3-download').style.display = 'flex';
                            document.getElementById('batch-download-btn').href = `/batch/download/${jobId}`;
                        } else if (status.status === 'error') {
                            clearInterval(pollInterval);
                            loaderOverlay.style.display = 'none';
                            alert('Batch processing failed: ' + status.error);
                        } else {
                            loaderText.innerText = `Processing: ${status.done} / ${status.total}`;
                        }
                    });
                }, 1000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred starting the batch job.');
                loaderOverlay.style.display = 'none';
            });
        }
    </script>
</body>
</html>
