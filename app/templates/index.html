<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Print Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="kiosk-body">
    <!-- Loader -->
    <div id="loader-overlay">
        <div class="kiosk-spinner"></div>
        <p id="loader-text">PROCESSING...</p>
    </div>

    <!-- Main Layout -->
    <div class="kiosk-layout">
        
        <!-- Left: Canvas Area (65%) -->
        <main class="kiosk-canvas-area" id="canvas-area">
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="image-upload" accept="image/*" hidden>
                <div class="upload-message">
                    <h1>CLICK OR DRAG IMAGE</h1>
                    <p>TO START THE PRESS</p>
                </div>
            </div>
            <div class="preview-zone" id="preview-zone" style="display: none;">
                <div class="canvas-wrapper">
                    <!-- We use an img for Cropper.js, and a canvas for Halftone/Dither preview -->
                    <img id="source-image" src="" style="display: none;">
                    <canvas id="live-canvas"></canvas>
                </div>
                <!-- Floating Toolbar for Crop (only visible during crop) -->
                <div class="crop-toolbar" id="crop-toolbar" style="display: none;">
                    <button class="kiosk-btn sm" id="btn-crop-cancel">CANCEL</button>
                    <button class="kiosk-btn sm primary" id="btn-crop-apply">APPLY CROP</button>
                </div>
            </div>
        </main>

        <!-- Right: Control Board (35%) -->
        <aside class="kiosk-control-board">
            <div class="board-header">
                <h2>RETRO PRINT SUITE</h2>
                <div class="header-actions">
                    <button class="kiosk-btn icon" id="btn-reset" title="Start Over">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                    </button>
                </div>
            </div>

            <div class="board-content" id="control-modules" style="opacity: 0.5; pointer-events: none;">
                
                <!-- Module 1: The Basics -->
                <div class="kiosk-module">
                    <div class="module-title">BASICS</div>
                    <div class="module-grid">
                        <button class="kiosk-btn outline" id="btn-tool-crop">
                            CROP & ROTATE
                        </button>
                    </div>
                </div>

                <!-- Module 2: AI Magic -->
                <div class="kiosk-module">
                    <div class="module-title">AI MAGIC</div>
                    <button class="kiosk-btn outline" id="btn-tool-bg">
                        REMOVE BACKGROUND
                    </button>
                </div>

                <!-- Module 3: Retro Studio -->
                <div class="kiosk-module">
                    <div class="module-title">RETRO STUDIO</div>
                    
                    <div class="style-toggle">
                        <label class="toggle-option">
                            <input type="radio" name="retro_mode" value="none" checked>
                            <span class="toggle-btn">NONE</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="retro_mode" value="halftone">
                            <span class="toggle-btn">HALFTONE</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="retro_mode" value="dither">
                            <span class="toggle-btn">DITHER</span>
                        </label>
                    </div>

                    <!-- Halftone Controls -->
                    <div id="halftone-controls" class="sub-controls" style="display: none;">
                        <div class="slider-group">
                            <div class="slider-header">
                                <span>DOT SIZE</span>
                                <span class="val-badge" id="val-ht-size">10</span>
                            </div>
                            <input type="range" class="kiosk-fader" id="halftone_size" min="2" max="50" step="1" value="10">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <span>ANGLE</span>
                                <span class="val-badge" id="val-ht-angle">0&deg;</span>
                            </div>
                            <input type="range" class="kiosk-fader" id="halftone_angle" min="0" max="90" step="1" value="0">
                        </div>
                        <div class="shape-grid">
                            <label class="shape-option">
                                <input type="radio" name="halftone_shape" value="round" checked>
                                <span class="shape-btn">ROUND</span>
                            </label>
                            <label class="shape-option">
                                <input type="radio" name="halftone_shape" value="square">
                                <span class="shape-btn">SQUARE</span>
                            </label>
                            <label class="shape-option">
                                <input type="radio" name="halftone_shape" value="line">
                                <span class="shape-btn">LINE</span>
                            </label>
                        </div>
                    </div>

                    <!-- Dither Controls -->
                    <div id="dither-controls" class="sub-controls" style="display: none;">
                        <div class="shape-grid dither">
                            <label class="shape-option">
                                <input type="radio" name="dither_method" value="floyd_steinberg" checked>
                                <span class="shape-btn">FLOYD</span>
                            </label>
                            <label class="shape-option">
                                <input type="radio" name="dither_method" value="bayer4x4">
                                <span class="shape-btn">BAYER</span>
                            </label>
                            <label class="shape-option">
                                <input type="radio" name="dither_method" value="atkinson">
                                <span class="shape-btn">ATKINSON</span>
                            </label>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Export Footer -->
            <div class="board-footer">
                <button class="kiosk-btn massive primary" id="btn-download" disabled>
                    DOWNLOAD HIGH RES
                </button>
            </div>
        </aside>
    </div>

    <!-- Hidden form for backend submission -->
    <form id="download-form" action="{{ url_for('main.download_image') }}" method="POST" enctype="multipart/form-data" style="display: none;">
        <input type="file" name="image" id="hidden-image-input">
        <input type="hidden" name="crop_x" id="hidden-crop-x">
        <input type="hidden" name="crop_y" id="hidden-crop-y">
        <input type="hidden" name="crop_w" id="hidden-crop-w">
        <input type="hidden" name="crop_h" id="hidden-crop-h">
        <input type="hidden" name="crop_rotate" id="hidden-crop-rotate">
        <input type="hidden" name="remove_bg" id="hidden-remove-bg">
        <input type="hidden" name="dither_method" id="hidden-dither-method">
        <input type="hidden" name="halftone_shape" id="hidden-halftone-shape">
        <input type="hidden" name="halftone_size" id="hidden-halftone-size">
        <input type="hidden" name="halftone_angle" id="hidden-halftone-angle">
        <input type="hidden" name="save_format" value="PNG">
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
